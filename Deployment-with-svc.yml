# ---------------------------------------------------------
# Kubernetes Deployment
# ---------------------------------------------------------
# This Deployment creates and manages 3 Nginx Pods.
#
# Deployment
#     ↓
# ReplicaSet
#     ↓
# 3 Nginx Pods
# ---------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: deploy
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: pod-05
          image: nginx:latest
          ports:
            - containerPort: 80
---
# ---------------------------------------------------------
# Kubernetes NodePort Service
# ---------------------------------------------------------
# This Service exposes the Nginx Pods outside the cluster
# using a NodePort.
#
# The Service selects Pods with:
#     app: nginx
#
# Traffic flow:
#
# NodeIP:NodePort
#       ↓
# Service:80
#       ↓
# Pod:80
#       ↓
# Nginx
# ---------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: deployment-svc
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      protocol: "TCP"
  type: NodePort









    















































