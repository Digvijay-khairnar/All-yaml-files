# ---------------------------------------------------------
# Kubernetes NodePort Service
# ---------------------------------------------------------
# This Service exposes the Nginx Pod outside the cluster
# using a port on each Kubernetes Node.
#
# The Service selects the Pod using:
#     app: nodeport
#
# Traffic flow:
#     NodeIP:31111 -> Service:80 -> Pod:80
# ---------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: my-svc-nodeport-01
spec:
  type: NodePort
  selector:
    app: nodeport
  ports:
    - port: 80
      targetPort: 80
      nodePort: 31111
      protocol: "TCP"

---
apiVersion: v1
kind: Pod
metadata: 
  name: pod-04
  labels:
    app:  nodeport
spec:
  containers:
    - name: my-con-04
      image: nginx:latest
      ports:
        - containerPort: 80
