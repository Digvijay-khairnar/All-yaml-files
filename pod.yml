# ---------------------------------------------------------
# Kubernetes Pod
# ---------------------------------------------------------

# This YAML file creates a simple Kubernetes Pod.
#
# The Pod contains one Nginx container.
# The Nginx container runs on port 80.
# ---------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: pod-02
spec:
  containers:
    - name: my-cont-01
      image: nginx:latest
      ports:
        - containerPort: 80